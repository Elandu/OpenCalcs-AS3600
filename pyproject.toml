[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "opencalcs-as3600"
version = "0.1.0"
description = "Reinforced concrete section mechanics plugin for OpenCalcs."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "concreteproperties==0.8.0",
  "jsonschema>=4.22,<5",
  "sectionproperties==3.10.2",
]

[project.urls]
Repository = "https://github.com/Elandu/OpenCalcs-AS3600"
Issues = "https://github.com/Elandu/OpenCalcs-AS3600/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.entry-points."opencalcs.plugins"]
as3600 = "opencalcs_as3600.plugin:get_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/opencalcs_as3600"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
